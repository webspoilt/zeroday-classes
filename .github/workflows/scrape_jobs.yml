name: Daily Job Scraping

on:
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC is 9:30 AM IST (Closest to 10 AM)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_scripts/requirements.txt

      - name: Run Scraper
        run: python python_scripts/job_scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/jobs.json
          git commit -m "chore: nightly job update [skip ci]" || echo "No changes to commit"
          git push origin main
